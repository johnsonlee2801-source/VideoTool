# XcodeGen spec. Regenerate the project with:  scripts/regen.sh
# App/Info.plist is generated from the x-info-properties block below by scripts/regen.sh
# (xcodegen's own plist writer uses an atomic write the agent sandbox blocks).
name: VideoTool
options:
  bundleIdPrefix: io.github.johnsonlee2801-source
  deploymentTarget:
    macOS: '14.0'
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
  generateEmptyDirectories: true
packages:
  MPVKit:
    url: https://github.com/mpvkit/MPVKit.git
    revision: 98c3453e252922e3136422da3fbb2e341ed9edc8
  VideoToolCore:
    path: VideoToolCore
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: '14.0'
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: 'NO'
    ENABLE_USER_SCRIPT_SANDBOXING: 'NO'
    COMPILER_INDEX_STORE_ENABLE: 'NO'
targets:
  VideoTool:
    type: application
    platform: macOS
    sources:
    - path: App/Sources
    - path: App/Resources
      optional: true
      excludes:
      - i18n/**          # translation sources (tools/i18n.py), not app resources
    dependencies:
    - package: MPVKit
      product: MPVKit
    - package: VideoToolCore
      product: VideoToolCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.johnsonlee2801-source.videotool
        PRODUCT_NAME: VideoTool
        LD_RUNPATH_SEARCH_PATHS:
        - $(inherited)
        - '@executable_path/../Frameworks'
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: 'NO'
  VideoToolTests:
    type: bundle.unit-test
    platform: macOS
    sources:
    - path: Tests/VideoToolTests
    - path: Tests/Fixtures
      buildPhase: resources
    dependencies:
    - target: VideoTool
    - package: VideoToolCore
      product: VideoToolCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: 'YES'
        PRODUCT_BUNDLE_IDENTIFIER: io.github.johnsonlee2801-source.videotool.tests
schemes:
  VideoTool:
    build:
      targets:
        VideoTool: all
        VideoToolTests:
        - test
    run:
      config: Debug
    test:
      config: Debug
      targets:
      - VideoToolTests
      # Tests read the Chinese (source) interface text whatever the Mac's language is.
      commandLineArguments:
        "-AppleLanguages (zh-Hans)": true
        "-AppleLocale zh_CN": true
x-info-properties:
