# Tuning knobs for hold-drag-speed.lua. Edit, then restart mpv.

# Seconds the button must stay down before it counts as a hold (shorter = pause).
hold_threshold=0.25

# Speed applied as soon as the hold is recognised, before any drag.
hold_speed=2.0

# Slow stage: horizontal points (HiDPI-corrected) per 0.1x, both directions.
px_per_tenth=20

# Right of this speed the fast stage takes over (set to max_speed to disable).
boost_from_speed=3.0

# Fast stage: points per 0.1x.
px_per_tenth_fast=10

# Points of horizontal movement ignored before dragging starts to count.
deadzone_px=8

# Hard limits.
min_speed=0.5
max_speed=6.0

# Round the live speed to 0.1 steps (1 = yes, 0 = continuous).
snap_tenths=1

# Restore the pre-hold speed on release (1) or keep the dragged speed (0).
restore_on_release=1
