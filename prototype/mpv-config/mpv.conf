# Prototype config for the hold-and-drag speed experiment.
# Loaded only when mpv is started through run.sh (--config-dir), so it never
# touches ~/.config/mpv.

# The script owns the left mouse button, so mpv must not use it to move the window.
window-dragging=no

# Keep the last frame on screen instead of quitting at end of file.
keep-open=yes

# Pitch-preserving speed change (mpv default, stated explicitly for clarity).
audio-pitch-correction=yes

# Hardware decoding on macOS.
hwdec=auto-safe

# Show the OSD bar and the speed read-out a bit larger.
osd-font-size=42
osd-duration=800

# Remember position per file (handy while testing the same clip repeatedly).
save-position-on-quit=yes
